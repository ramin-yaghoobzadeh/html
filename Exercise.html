<!DOCTYPE html>
<html lang="fa-IR" dir="rtl">

<head>
    <meta charset="UTF-8">
    <title>فروشگاه اینترنتی دیجی کالا</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
        }

        #wrapper {
            height: 100vh;
            margin: 0 2px;
            border-radius: 20px;
            background-color: #ffffff;
        }

        #box-header1 {
            width: 100%;
            height: 68px;
            padding: 12px 16px;
            border: 1px solid #414141;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .box-header2 {
            width: 815px;
            height: 44px;
            border: 1px solid #414141;
            display: flex;
            align-items: center;
        }

        .box-header3 {
            width: 251.29px;
            height: 44px;
            border: 1px solid #414141;
            display: flex;
            align-items: center;
        }

        .logo {
            width: 195px;
            height: auto;
            margin-left: 18px;
        }

        #Search-Box {
            /* **************************************************************** */
            width: 600px;
            height: 44px;
            background-color: #f0f0f1;
            border-radius: 24px;
            /* **************************************************************** */
        }
    </style>
</head>

<body>
    <div id="wrapper">
        <div id="box-header1">
            <div class="box-header2">
                <img class="logo" src="/Images/Logo.svg" alt="لوگو دیجی کالا" />
                <div id="Search-Box"></div>
            </div>

            <div class="box-header3"></div>

        </div>
</body>

</html>
