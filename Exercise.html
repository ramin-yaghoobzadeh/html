<!DOCTYPE html>
<html lang="fa-IR" dir="rtl">

<head>
    <meta charset="UTF-8">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@100..900&display=swap" rel="stylesheet">
    <!-- ************************************************************* -->
    <meta name="keywords" content="کامپیوتر, موبایل, لپ تاپ" />
    <!-- ************************************************************* -->

    <title>فروشگاه اینترنتی دیجی کالا</title>
    <style>
        * {
            box-sizing: border-box;
        }

        #wrapper {
            max-width: 1600px;
            width: 100%;
            height: 100vh;
            margin: 0 auto;
            background-color: #ffffff;
            display: flex;
            justify-content: center;
        }

        #box-header1 {
            width: 1600px;
            height: 68px;
            padding: 12px 16px;
            border: 1px solid #414141;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .box-header2 {
            width: 815px;
            height: 44px;
            border: 0px solid #414141;
            display: flex;
            align-items: center;
        }

        .box-header3 {
            width: 251.29px;
            height: 44px;
            border: 1px solid #414141;
            display: flex;
            align-items: center;
        }

        .logo {
            width: 195px;
            height: auto;
            margin-left: 18px;
        }

        #Search-Box {
            width: 600px;
            height: 44px;
            background-color: #ECEDEF;
            border-radius: 25px;
            display: flex;
            align-items: center;
        }

        .search-icon {
            width: 18px;
            height: 18px;
            margin-right: 15px;
        }

        .search-icon path {
            fill: rgb(150, 150, 150);
        }

        .vazirmatn-regular {
            width: 500px;
            height: 35px;
            margin-right: 8px;
            border: 0px solid #414141;
            display: flex;
            align-items: center;
            font-family: "Vazirmatn", sans-serif;
            font-optical-sizing: auto;
            font-weight: 300;
            font-style: normal;
            font-size: 0.875rem;
            color: rgb(150, 150, 150);
        }
    </style>
</head>

<body>
    <div id="wrapper">
        <div id="box-header1">
            <div class="box-header2">
                <img class="logo" src="/Images/Logo.svg" alt="لوگو دیجی کالا" />
                <div id="Search-Box">
                    <svg class="search-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
                        <path
                            d="M416 208c0 45.9-14.9 88.3-40 122.7L502.6 457.4c12.5 12.5 12.5 32.8 0 45.3s-32.8 12.5-45.3 0L330.7 376C296.3 401.1 253.9 416 208 416 93.1 416 0 322.9 0 208S93.1 0 208 0 416 93.1 416 208zM208 352a144 144 0 1 0 0-288 144 144 0 1 0 0 288z" />
                    </svg>
                    <div class="vazirmatn-regular">جستجو</div>

                </div>
            </div>

            <div class="box-header3"></div>

        </div>
</body>

</html>
